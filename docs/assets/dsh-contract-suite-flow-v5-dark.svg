<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-contract-suite reconciliation sheet</title>
<desc id="desc">A contract comparison sheet, not an arrow pipeline. Each of the two members is one row. The columns are the surfaces the suite reconciles, numbered in check order: (1) ASSEMBLY, the two insert rows of cordis.patch.yml where id must equal name; (2) VERSIONS, the two exact pins in package.json dependencies; (3) RESOLVED, the node_modules source or the manifest pin plus the profile row enabled in the synthetic profile.json; (4) VERDICT. Stitch marks bind the same member across the cells, so no row can pass on one surface only. The margin band under the rows names the failure code each surface raises: rows differ from dependencies -> E_SUITE_PATCH_MISMATCH, an installed version drifts from the pin -> E_SUITE_VERSION_MISMATCH, a manifest or sample is missing or not valid JSON -> E_SUITE_MANIFEST_MISSING. The summary counts 2 rows = 2 pins = 2 resolved rows, with network false, zero writes and zero tools. Every name, version and count is read from package.json, cordis.patch.yml and the checked-in quickstart sample.</desc>
